name: ROLe CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend/app
      MONGO_URL: mongodb://127.0.0.1:27017/?serverSelectionTimeoutMS=2000
      MONGO_ADDRESS: localhost
      COLLECTION_NAME: role_ci
      TEST_COLLECTION_NAME: role_ci_test
      JWT_TOKEN: ci-only-not-a-production-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker build and smoke test
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: role-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create isolated Docker configuration
        run: |
          printf '%s\n' \
            'MONGO_URL=mongodb://mongo:27017/?serverSelectionTimeoutMS=5000' \
            'MONGO_ADDRESS=mongo' \
            'COLLECTION_NAME=role_ci' \
            'TEST_COLLECTION_NAME=role_ci_test' \
            'JWT_TOKEN=ci-only-not-a-production-secret' > backend/.env.docker

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build --pull

      - name: Start services and wait for healthchecks
        run: docker compose up -d --no-build --wait --wait-timeout 180

      - name: Check frontend and API through nginx
        run: |
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4173/ -o /tmp/role-index.html
          grep -q 'id="root"' /tmp/role-index.html
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4173/plan -o /tmp/role-plan.html
          cmp /tmp/role-index.html /tmp/role-plan.html
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:4173/api/ \
            | python3 -c 'import json, sys; assert json.load(sys.stdin)["message"] == "Hello user, welcome to ROLe!"'

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Clean up CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
